
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

github.webhook.secret=${GITHUB_WEBHOOK_SECRET}
github.app.token=${GITHUB_APP_TOKEN}
github.app.id=${GITHUB_APP_ID}
github.app.private-key=${GITHUB_PRIVATE_KEY:}
github.app.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}

claude.api.key=${CLAUDE_API_KEY}
claude.api.url=${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}

jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration